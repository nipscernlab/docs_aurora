# Confere o manual a cada push: o HTML precisa construir sem nenhum aviso.
# O PDF fica de fora porque usa a fonte Segoe UI, proprietaria da Microsoft,
# que nao pode ser instalada num runner Linux; ele e gerado na publicacao,
# pelo scripts/publish.ps1, numa maquina Windows.
name: Build da documentacao

on:
  push:
    branches: [main]
  pull_request:

jobs:
  html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build HTML (avisos viram erros)
        run: python -m sphinx -E -W --keep-going -b html source build/html

      - name: Verificacao de links (informativa)
        # Link externo fora do ar nao deve reprovar um commit do manual,
        # mas fica registrado no log para limpeza.
        continue-on-error: true
        run: python -m sphinx -b linkcheck source build/linkcheck
